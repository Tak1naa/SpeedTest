name: Compatibility result / 兼容性结果
description: Share real-device or emulated compatibility evidence
title: "[Compatibility]: "
labels: [testing]
body:
  - type: input
    id: version
    attributes:
      label: Project version / commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, architecture and browser versions
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Evidence type
      options:
        - Real device
        - Emulation / automation
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Commands, functional results and limitations
      description: Separate pass/fail/skip, Wi-Fi limits and throttled loopback results. Sanitize screenshots and addresses.
    validations:
      required: true
