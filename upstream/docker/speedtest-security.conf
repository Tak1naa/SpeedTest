<Directory /var/www/html>
    AllowOverride None
    Options -Indexes
    LimitRequestBody 33554432
    # Safe public-export default: local evaluation only.
    Require local
</Directory>
# IP-only deployment: reject arbitrary Host headers/DNS rebinding.
<If "%{HTTP_HOST} !~ m#^(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?$#">
    Require all denied
</If>
Timeout 20
RequestReadTimeout header=10-15,MinRate=500 body=5-18,MinRate=1024
ServerTokens Prod
ServerName localhost
ServerSignature Off
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
# Upstream uses inline scripts/handlers/styles; retain them rather than rewrite its UI.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
<IfModule mpm_prefork_module>
    StartServers 4
    MinSpareServers 4
    MaxSpareServers 8
    MaxRequestWorkers 16
    MaxConnectionsPerChild 1000
</IfModule>
CustomLog /dev/null combined
ErrorLog /dev/null
<FilesMatch "\.lua$">
    Require all denied
</FilesMatch>
<FilesMatch "^(rate_limit|getIP_util|getIP_ipInfo_apikey)\.php$">
    Require all denied
</FilesMatch>
