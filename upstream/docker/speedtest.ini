enable_post_data_reading=Off
; No PHP session upload tracking is used by the bounded discard endpoint.
session.upload_progress.enabled=Off
upload_tmp_dir=/tmp
sys_temp_dir=/tmp
file_uploads=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
max_execution_time=20
memory_limit=128M
expose_php=Off
