# Public export: all listeners are loopback-only until deliberately configured.
ServerRoot /var/www
Listen 127.0.0.1:8080
Listen 127.0.0.1:8443
ServerName localhost
PidFile /run/apache2/httpd.pid
LoadModule mpm_event_module /usr/lib/apache2/mod_mpm_event.so
LoadModule unixd_module /usr/lib/apache2/mod_unixd.so
LoadModule authz_core_module /usr/lib/apache2/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/mod_authz_host.so
LoadModule log_config_module /usr/lib/apache2/mod_log_config.so
LoadModule mime_module /usr/lib/apache2/mod_mime.so
LoadModule dir_module /usr/lib/apache2/mod_dir.so
LoadModule alias_module /usr/lib/apache2/mod_alias.so
LoadModule headers_module /usr/lib/apache2/mod_headers.so
LoadModule reqtimeout_module /usr/lib/apache2/mod_reqtimeout.so
LoadModule proxy_module /usr/lib/apache2/mod_proxy.so
LoadModule proxy_fcgi_module /usr/lib/apache2/mod_proxy_fcgi.so
LoadModule socache_shmcb_module /usr/lib/apache2/mod_socache_shmcb.so
LoadModule ssl_module /usr/lib/apache2/mod_ssl.so
User www-data
Group www-data
DocumentRoot /var/www/html
TypesConfig /etc/apache2/mime.types
DirectoryIndex index.php
ErrorLog /dev/null
CustomLog /dev/null combined
ProxyTimeout 20
# Bound event threads independently of the 16-worker PHP-FPM pool.
StartServers 2
ServerLimit 2
ThreadsPerChild 16
MaxRequestWorkers 32
MinSpareThreads 16
MaxSpareThreads 32
MaxConnectionsPerChild 1000
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:19000"
</FilesMatch>
Include /etc/apache2/speedtest-security.conf
# Serve the optional payment asset outside the upstream tmpfs cleanup directory.
Alias /coffee-qr.svg /run/speedtest-assets/coffee-qr.svg
<Directory /run/speedtest-assets>
    Options -Indexes
    AllowOverride None
    Require local
</Directory>
<VirtualHost 127.0.0.1:8443>
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /run/speedtest-tls/server.crt
    SSLCertificateKeyFile /run/speedtest-tls/server.key
    Header always set Strict-Transport-Security "max-age=86400"
</VirtualHost>
