  <rect x="1" y="1" width="318" height="318" rx="12" fill="#f7f7f7" stroke="#c6c6c6"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#333">
    <text x="160" y="148" font-size="20">请配置收款二维码</text>
    <text x="160" y="183" font-size="14" fill="#666">仅供占位 · 无支付功能</text>
  </g>
</svg>
