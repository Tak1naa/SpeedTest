# Candidate edge: loopback-only. Never enable accept-proxy on public listeners.
global
    nbthread 2
    maxconn 64
    maxsslconn 64
    user haproxy
    group haproxy
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-load-extra-files key

defaults
    mode http
    timeout connect 2s
    timeout client 20s
    timeout server 20s
    timeout http-request 5s
    timeout http-keep-alive 5s
    timeout queue 1s

backend source_limits
    stick-table type string len 64 size 20000 expire 60s store conn_cur,conn_rate(10s),http_req_rate(10s)

backend prefix_limits
    stick-table type string len 64 size 5000 expire 60s store conn_cur,http_req_rate(10s)

backend global_limits
    stick-table type string len 8 size 1 expire 60s store http_req_rate(10s)

frontend speedtest
    bind 127.0.0.1:8080
    bind [::1]:8080 v6only
    bind 127.0.0.1:8443 ssl crt /run/speedtest-tls/server.crt alpn http/1.1
    bind [::1]:8443 v6only ssl crt /run/speedtest-tls/server.crt alpn http/1.1
    maxconn 64
    rate-limit sessions 80
    tcp-request connection track-sc0 src table source_limits
    tcp-request connection track-sc1 src,ipmask(32,64) table prefix_limits
    tcp-request connection reject if { sc_conn_cur(0) gt 16 }
    tcp-request connection reject if { sc_conn_cur(1) gt 32 }
    tcp-request connection reject if { sc_conn_rate(0) gt 80 }
    http-request track-sc2 str(all) table global_limits
    http-request return status 429 content-type text/plain string "Request rate exceeded; retry later." hdr Retry-After 10 if { sc_http_req_rate(0) gt 600 } or { sc_http_req_rate(1) gt 1200 } or { sc_http_req_rate(2) gt 1200 }
    # Trust connection source only; forged forwarding headers have no influence.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request del-header X-Forwarded-Proto
    http-request deny deny_status 403 unless { hdr(host) -m reg -i ^(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?$ }
    http-request deny deny_status 413 if { req.hdr(content-length) -m int gt 33554432 }
    acl health path -i /health.php
    acl health_get method GET
    acl local_monitor src 127.0.0.0/8 ::1
    http-request redirect location https://%[hdr(host),regsub(:8080$,:8443)]%[url] code 307 unless { ssl_fc } or health health_get local_monitor
    default_backend apache

backend apache
    # Never reuse a PROXY connection for another client's HTTP request.
    option http-server-close
    http-reuse never
    server app 127.0.0.1:18080 send-proxy-v2 maxconn 16
